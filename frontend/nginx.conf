server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Never cache the runtime config, so an ops change to apiBaseUrl takes effect
  # on the next load rather than being pinned by the browser.
  location = /skywatch-config.js {
    add_header Cache-Control "no-store";
  }

  # Single-page app: unknown paths fall back to index.html so client-side
  # routing (/map, /spoofing, ...) works on a hard refresh.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
