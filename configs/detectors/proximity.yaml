# skywatch.proximity — versioned rule set (the "baseline" for a rule-based detector)
#
# Every number the detector uses lives HERE, not in code. Bump config_version
# whenever a value changes so an old detection can be explained by the config
# that produced it.
#
# Sources for the thresholds:
#   - En route standard separation: 5 nm horizontal / 1000 ft vertical
#   - Terminal separation:          3 nm horizontal / 1000 ft vertical
#   - FAA near-midair-collision:    < 500 ft total separation

detector_id: skywatch.proximity
detector_version: 0.1.0
config_version: 2026-10-26.2

# --- Time alignment (tracks.py) ----------------------------------------------
grid_step_s: 1.0        # interpolate every track onto this common clock
max_gap_s: 30.0         # never interpolate across a silence longer than this

# --- Candidate pairs + cheap filters (pairs.py) ------------------------------
cell_size_deg: 0.5      # lat/lon grid cell for spatial binning (~30 nm)
max_vertical_prefilter_ft: 2000   # drop pairs stacked further apart than this
ground_altitude_ft: 3000  # backup ground check: below this (MSL!) AND ...
ground_speed_kt: 50       # ... slower than this => treat as on the ground
# NOTE: altitude is barometric MSL, and Lynchburg sits at 938 ft, Roanoke at
# 1175 ft. The speed check does the real work; replacing the altitude number
# with per-airport field elevation (FAA NASR) is Week-9 context work.

# --- Closest approach gates (detector.py) ------------------------------------
max_tcpa_s: 120.0       # beyond this, straight-line prediction is unreliable
# Don't trust a prediction made from a pair that is already far apart. Fast
# closers (~900 kt) cover 30 nm in 2 minutes, and on the Lynchburg hour the
# median straight-line miss is 0.65 nm at 120 s (p90 5.2 nm) but only 0.13 nm at
# 60 s (p90 1.6 nm). 10 nm keeps even the fastest closers to ~40 s lookahead.
max_current_separation_nm: 10.0
# Terminal-airspace floor. Below 5,000 ft MSL this detector does not report.
# On the Lynchburg hour 338 of 354 flagged pairs (95%) had an aircraft below
# 5,000 ft: median altitude 2,818 ft, median speed 169 kt, 26% below 1,000 ft.
# That is pattern work, approach and departure — traffic that is close on
# purpose, under separation standards we do not model, maneuvering in ways a
# constant-track prediction cannot follow. En route traffic is what this
# detector is built for; terminal proximity needs airport and runway context
# (FAA NASR) we do not have yet.
min_altitude_ft: 5000

# --- Severity tiers, evaluated top to bottom; BOTH limits must hold ----------
# predicted separation at closest approach, not current separation
#
# LOW/INFO vertical limit is 900 ft, not 1000: 1000 ft IS the standard vertical
# separation (RVSM, FL290-FL410, and below), so a pair holding ~1000 ft apart is
# exactly as separated as ATC intends. Reported altitudes jitter around 1000 by
# ~25-30 ft (5th-95th pct 972-1025 ft on the Lynchburg hour), and a limit of
# 1000 flagged every pair that jittered to 975-999 ft (256 of 1,128 detections).
tiers:
  - severity: HIGH
    max_horizontal_nm: 0.5
    max_vertical_ft: 400
  - severity: MEDIUM
    max_horizontal_nm: 1.5
    max_vertical_ft: 700
  - severity: LOW
    max_horizontal_nm: 3.0
    max_vertical_ft: 900
#
# PROX-3: the INFO tier is removed, not loosened. It fired at < 5 nm / < 900 ft,
# and 5 nm / 1000 ft IS en route standard separation -- so INFO reported pairs
# that were correctly separated. On the Lynchburg hour all 25 INFO detections
# sat at 3.09-4.96 nm and 820-900 ft, bunched against both limits, which is
# where lawfully separated traffic lives. Nobody can act on "these two aircraft
# complied with the standard", and every row flows downstream to TCE/CAATS.
# LOW (3 nm) remains the loosest thing we will emit.
#  - severity: INFO
#    max_horizontal_nm: 5.0
#    max_vertical_ft: 900
