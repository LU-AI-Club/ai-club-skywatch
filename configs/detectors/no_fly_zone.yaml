# NoFlyZoneDetector configuration.
# Every tunable number lives here. If you are typing a constant into a
# module, it belongs in this file instead.

detector:
  id: skywatch.no_fly_zone
  version: 0.1.0
  detection_type: restricted_airspace_incursion
  feature_schema_version: air-features-v1
  rules_version: nfz-rules-0.1.0

scope:
  center_name: KLYH
  center_lat: 37.3267
  center_lon: -79.2004
  radius_nm: 150

sampling:
  target_hz: 1.0
  max_gap_sec: 30         # silence longer than this closes an incursion episode
                          # (logic/episodes.py); small planes may report every 5-10 s
  seen_retention_sec: 3600  # adapter forgets an aircraft's last-processed time after
                          # this much silence; must exceed the live runner's window_s

airspace:
  # Relative to air/detectors/no_fly_zone/ (the CLI resolves it there), not to this file.
  fixture_path: fixtures/airspace/klyh-150nm.geojson
  # Real FAA zones for the LIVE runner only (build_live_detector): the Lynchburg
  # area (within 65 nm of KLYH) plus P-56, Washington DC, as an always-active
  # prohibited area. Committed so every machine runs the same 15 zones. Rebuild
  # it each FAA cycle with the command in docs/RUN_PIPELINE.md.
  # Tests, replay and the CLI always use fixture_path.
  live_path: fixtures/airspace/klyh-local-faa.geojson
  # SYNTHETIC demo zone(s), NOT real airspace: DEMO-1, a 1 nm prohibited circle
  # 3 nm west of KLYH (SFC-5000 ft MSL, always active) where local traffic flies,
  # so a live demo or frontend test gets HIGH incursions on real aircraft. Added
  # ON TOP of the live zones only when SKYWATCH_NFZ_DEMO_ZONES=1 (see
  # build_live_detector and docs/RUN_PIPELINE.md). Off by default; tests, replay
  # and the CLI never load it.
  demo_path: fixtures/airspace/klyh-demo.geojson
  source_asof: "2026-08-07"   # SUA publication cycle; update with the file
  include_types: [PROHIBITED, RESTRICTED, TFR, WARNING, ALERT, MOA]
  # Community-reported U.S. DoD block; heuristic, not authoritative identity proof.
  military_icao24_ranges:
    - ["AE0000", "AFFFFF"]

geometry:
  h3_resolution: 7        # ~5 km cells, matches SENTINEL
  default_uncertainty_m: 185   # used when NIC/NACp are missing

filters:
  drop_on_ground: true

scoring:
  base_by_zone_type:
    PROHIBITED: 0.9
    RESTRICTED: 0.7
    TFR: 0.7
    WARNING: 0.3
    ALERT: 0.3
    MOA: 0.2
  depth_bump_per_nm: 0.01
  depth_bump_max: 0.1
  # Confidence is evidence strength, not threat severity or a calibrated probability.
  # Per-report factors multiply; persistence then scales every episode by the elapsed
  # time of its uninterrupted run of fired reports.
  confidence:
    active_activation_factor: 1.0
    unknown_activation_factor: 0.6
    strict_position_min_factor: 0.5
    buffered_position_factor: 0.35
    preferred_altitude_factor: 1.0
    fallback_altitude_factor: 0.8
    persistence_min_factor: 0.3
    persistence_saturation_sec: 15.0
  context_weights:        # subtracted from the score
    atc_discrete_squawk: 0.4
    military_hex: 0.3
    lifeguard_callsign: 0.3
    emergency_squawk: 0.2

severity:
  unknown_activation_cap: LOW
  buffered_only: INFO
  # The highest severity a zone type can reach, whatever else is true.
  # A MOA is not closed airspace: flying through one is legal even while it is
  # in use, so an aircraft inside an active MOA is context, never an alarm.
  # Types not listed are uncapped (HIGH when the zone is known to be active).
  zone_type_cap:
    MOA: LOW

dedup:
  # One Detection per incursion episode (logic/episodes.py). An episode closes
  # after this many consecutive reports from the aircraft that do not fire for
  # the zone, or after sampling.max_gap_sec of silence.
  clear_observations_to_close: 2
